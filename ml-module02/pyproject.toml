[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cinnasense-quality"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
training = ["tensorflow>=2.16,<2.22", "Pillow>=10.4,<13", "scikit-learn>=1.4,<2", "numpy>=1.26,<3"]
api = ["python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "Pillow>=10.4,<13", "tensorflow>=2.16,<2.22", "numpy>=1.26,<3"]
test = ["Pillow>=10.4,<13", "fastapi>=0.115,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "numpy>=1.26,<3"]
[tool.setuptools.packages.find]
where = ["src"]
